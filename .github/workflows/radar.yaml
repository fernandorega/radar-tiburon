name: Radar Tiburon Alertas

on:
  schedule:
    - cron: '*/10 6-18 * * 1-5'
  workflow_dispatch:

jobs:
  ejecutar-radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install yfinance pandas numpy tzdata

      - name: Ejecutar radar
        env:
          EMAIL_REMITENTE: ${{ secrets.EMAIL_REMITENTE }}
          EMAIL_PASSWORD_APP: ${{ secrets.EMAIL_PASSWORD_APP }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
        run: python radar_headless.py
